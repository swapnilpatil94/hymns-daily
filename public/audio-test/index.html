<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Audio test</title>
<style>body{font:18px/1.5 system-ui;max-width:30rem;margin:0 auto;padding:1.2rem;background:#111;color:#eee}button{display:block;width:100%;font-size:18px;padding:.9rem;margin:.6rem 0;border-radius:10px;border:0;background:#e6c46a}pre{background:#222;padding:.8rem;border-radius:8px;white-space:pre-wrap}</style></head>
<body><h1>Audio test</h1>
<p>Turn the volume up. Tap each button and tell me whether you heard a beep, plus the text below.</p>
<button id="a">1. Beep (normal)</button>
<button id="b">2. Beep (media mode)</button>
<pre id="o">ready</pre>
<script>
const o=document.getElementById('o');const log=(t)=>{o.textContent+='\n'+t};
let ctx;
function beep(media){
  try{
    if(media&&navigator.audioSession){navigator.audioSession.type='playback'}
    log('audioSession='+(navigator.audioSession?navigator.audioSession.type:'unsupported'));
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    log('state before='+ctx.state);
    ctx.resume().then(()=>{
      log('state after='+ctx.state);
      const os=ctx.createOscillator(),g=ctx.createGain();g.gain.value=.3;os.frequency.value=440;os.connect(g);g.connect(ctx.destination);os.start();os.stop(ctx.currentTime+1);
    });
  }catch(e){log('error: '+e.message)}
}
log(navigator.userAgent);
a.onclick=()=>beep(false);b.onclick=()=>beep(true);
</script></body></html>
