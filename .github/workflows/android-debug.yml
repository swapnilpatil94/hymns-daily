name: Build debug APK
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: hymns-daily-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hymns-daily-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest hymns-daily-debug.apk --title "Hymns Daily debug APK" --notes "Debug build for testing. Test ads only." --prerelease
